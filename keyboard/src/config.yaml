meta:
  engine: 4.1.0
  name: pinkyless48
  version: 1.0.0
  author: tesliuk

# ---------------------------------------------------------------------------
# pinkyless48 - a 48-key (24 per half) column-staggered split keyboard
#
#   * Kailh Choc v1 low-profile switches, 18 mm columns (19.8 for the inner
#     column) x 17 mm rows
#   * 4 rows x 5 columns; the pinky drops only the bottom row, so the number
#     row keeps all five columns and carries 0-9 across the two halves
#   * 5 thumb keys per half: a 3-key arc plus a 2-key island, starting where
#     the finger matrix ends rather than tucked underneath it
#   * Wired, QMK, RP2040 "Pro Micro" form-factor controller, TRRS between halves
#   * Reversible: ONE pcb design, flipped over to make the right half
#
# Electrical matrix is 5 columns x 5 rows = 25 cells for 24 keys. The fifth
# row exists purely to give the five thumb keys somewhere to live; the finger
# matrix only uses rows R1-R4.
#
# Change a unit, rebuild, and the PCB *and* the 3D-printed case both follow -
# the case generator reads the key positions this file produces.
# ---------------------------------------------------------------------------

units:
  # Kailh Choc v1 switch pitch.
  #
  # The Choc standard is 18.0 x 17.0, which leaves only 0.5 mm between
  # adjacent MBK keycaps in both directions and 2.0 mm between switch base
  # flanges on the row axis. That is what every stock Choc board uses and it
  # does work - but it is genuinely tight for getting a puller in, and it
  # leaves no margin at all for keycaps that are a touch larger than MBK.
  #
  # These are opened slightly: 1.0 mm between caps across columns, 1.5 mm
  # down rows, and 3.0 mm between switch flanges. Costs ~2 mm of board width
  # and ~3 mm of height. Set back to 18/17 for stock Choc spacing, or 19.05
  # for both if you switch to MX.
  kx: 18.5
  ky: 18

  # Column pitch for the INNER column only.
  #
  # The reversible Choc hotswap footprint carries socket pads for both faces
  # of the board and is +/-9.58 mm wide - wider than the 18 mm column pitch.
  # Two columns at the SAME vertical offset therefore short against each
  # other unless they are >= 19.4 mm apart or >= 2.9 mm apart vertically.
  #
  # This stagger deliberately puts index and inner at identical height, so
  # that one gap is opened to 19.8 mm. Every other gap stays at 18 mm,
  # because every other neighbouring pair differs by 4 mm or more in height
  # and clears on the vertical offset alone.
  kx_inner: 19.8

  # How much board to leave around a key when building the outline.
  bleed: 6

  # Radius for the morphological closing that fills concave pockets in the
  # outline. Fills notches narrower than roughly 2*close; raise it to smooth
  # the board further, lower it to keep more of the key-shaped silhouette.
  #
  # 18 is enough to close the wide bay between the controller area and the
  # thumb cluster, giving a straight inboard edge. That bay is dead space, so
  # filling it costs ~6 cm2 of board and nothing in bounding box.
  close: 18

  # --- Column stagger -----------------------------------------------------
  # ABSOLUTE offsets in mm, measured from the ring/index/inner baseline.
  # Positive = that column sits further AWAY from you (forward/higher).
  #
  # Read across the left half from the inboard edge outwards:
  #   inner  ]
  #   index  ]-- all three level with each other, the baseline
  #   ring   ]
  #   middle    a bit higher
  #   pinky     lowest, by a lot
  #
  # The pinky drop is deliberately large (12 mm below the baseline, 16 mm
  # below middle). It has to be: the pinky column carries only three keys and
  # skips the BOTTOM row, so its block sits in the upper three row positions.
  # With a small stagger the column reads as sitting HIGHER than its
  # neighbours even though each individual key is lower. 12 mm brings the
  # whole block down to where a short finger actually rests.
  #
  # This is a deliberately flat profile. It is NOT the usual finger-length
  # stagger, where ring sits well forward of index; here ring drops back to
  # the baseline and only the middle finger gets extra reach.
  #
  # NOTE: ergogen's `stagger` is CUMULATIVE - each column's stagger is added
  # to the running total, not measured from the origin. So below, every
  # column asks for `st_x - st_previous`. Edit these absolute values and the
  # deltas take care of themselves.
  st_pinky: -12
  st_ring: 0
  st_middle: 4
  st_index: 0
  st_inner: 0

  # --- Thumb cluster ------------------------------------------------------
  # The cluster is positioned by explicit offsets from matrix_inner_bottom
  # (see the `thumb` zone below), so the geometry is directly readable
  # instead of emerging from chained rotations. t1-t3 are the comfortable
  # arc; t4-t5 are the deliberate stretch island tucked below it.

points:
  key:
    padding: ky      # row-to-row distance
    spread: kx       # column-to-column distance

  zones:
    # -------------------------------------------------------------------
    # Main finger matrix.
    #
    # Rows are listed BOTTOM to TOP (an ergogen convention), so the order
    # below reads: bottom row, home row, top row, number row.
    #
    # The pinky column skips only 'bottom' - the position it reaches worst -
    # keeping home, top and number. That is the "I don't like using pinkies"
    # requirement, tempered by needing a full 10-key number row.
    # -------------------------------------------------------------------
    matrix:
      anchor:
        shift: [60, -160]
      columns:
        pinky:
          key:
            stagger: st_pinky
            column_net: C1
          rows:
            # The pinky keeps the number row - with all five columns present
            # the number row carries 10 keys across both halves, which is
            # exactly enough for 0-9. Only the bottom row is dropped, which
            # is the position the pinky reaches worst.
            bottom.skip: true
        ring:
          key:
            stagger: st_ring - st_pinky
            column_net: C2
        middle:
          key:
            stagger: st_middle - st_ring
            column_net: C3
        index:
          key:
            stagger: st_index - st_middle
            column_net: C4
        inner:
          key:
            spread: kx_inner      # see kx_inner - avoids a socket-pad short
            stagger: st_inner - st_index
            column_net: C5
      rows:
        bottom:
          row_net: R1
        home:
          row_net: R2
        top:
          row_net: R3
        num:
          row_net: R4

    # -------------------------------------------------------------------
    # Thumb cluster - 5 keys, wired as row R5 across all five columns.
    #
    #   t1 t2 t3   <- comfortable arc, thumb sweeps inboard and down
    #     t4 t5    <- stretch island, tucked below the arc
    #
    # spread/padding are zeroed so every key is positioned by an explicit
    # shift from the zone anchor rather than by grid advance. Rotations
    # follow the thumb's natural arc.
    #
    # ANCHORING: the zone hangs off matrix_inner_bottom - the LAST (most
    # inboard) finger column - and t1 has an x-shift of exactly 0. So the
    # nearest thumb key sits directly below the innermost finger column, and
    # the cluster extends inboard from there rather than being tucked back
    # underneath the finger matrix. That is a structural property of the
    # config, not a constant to maintain: add or remove a finger column and
    # the cluster still starts where the matrix ends.
    #
    # The thumb reaches in and down from a pivot near the inner edge of the
    # hand, so the arc descends as it travels inboard.
    # -------------------------------------------------------------------
    thumb:
      anchor:
        ref: matrix_inner_bottom
      columns:
        # Spacing here is set so that NO pair in the thumb cluster is tighter
        # than the regular grid is with itself (1.00 mm between MBK caps,
        # 0.50 mm between wider 18x17 caps). Rotated keys lose clearance at
        # their corners, so the arc needs slightly more than the grid pitch
        # to end up equally roomy, and t1 sits a little lower than a plain
        # row step would put it to clear the inner column's bottom key.
        t1:
          key:
            spread: 0
            shift: [0, -19]
            rotate: -8
            column_net: C1
        t2:
          key:
            spread: 0
            shift: [19.1, -24.9]
            rotate: -18
            column_net: C2
        t3:
          key:
            spread: 0
            shift: [37.4, -33.0]
            rotate: -28
            column_net: C3
        t4:
          key:
            spread: 0
            shift: [6, -46.0]
            rotate: -14
            column_net: C4
        t5:
          key:
            spread: 0
            shift: [24.8, -52.8]
            rotate: -24
            column_net: C5
      rows:
        thumb:
          row_net: R5

    # -------------------------------------------------------------------
    # Controller, TRRS jack and reset button.
    #
    # These are declared as single-key ZONES rather than placed with an
    # `adjust` shift on an existing key. That is deliberate: ergogen mirrors
    # whole POINTS, but it does not mirror an `adjust` shift, so anything
    # positioned by adjust lands on the same side of both halves - i.e.
    # inboard on the left and outboard on the right. Giving them their own
    # points means the global mirror moves them correctly.
    #
    # They are excluded from the switch/diode footprints by name: every
    # filter below selects on `matrix_` / `thumb_` prefixes.
    # -------------------------------------------------------------------
    # Controller lies FLAT (rotate 180), not on end. A Pro Micro is 33 x 18 mm,
    # so standing it vertically forced the board ~12 mm taller than the tallest
    # key just to clear it, which is what produced the tower of empty board
    # above the matrix. Laid flat it spreads sideways across ground the board
    # already covers. rotate 180 points the USB port inboard (+x), so the cable
    # exits the top inner corner rather than across the keys.
    # The controller sits in the notch between the finger matrix and the thumb
    # cluster, NOT on a strip above the matrix.
    #
    # Because the thumb cluster runs inboard and down, the area outboard of it
    # and below the number row is dead space already inside the board's
    # bounding box. Putting the controller there costs nothing in overall
    # size, whereas a strip above the matrix added ~30 mm of height for a part
    # that is only 33 x 18 mm.
    #
    # rotate 180 lays it flat with the USB port facing inboard (+x), so the
    # cable exits the inner edge between the two halves.
    mcu:
      anchor:
        ref: matrix_inner_top
        shift: [28, -4]
        rotate: 180
      columns:
        mcu:
      rows:
        mcu:

    trrs:
      anchor:
        ref: matrix_inner_num
        shift: [28, 5]
      columns:
        trrs:
      rows:
        trrs:

    reset:
      anchor:
        ref: matrix_inner_num
        shift: [16, 5]
      columns:
        reset:
      rows:
        reset:

    # -------------------------------------------------------------------
    # Web patch.
    #
    # t2/t3/t4/t5 surround a ~7 x 5 mm gap that their grown key pads do not
    # quite close, which would come out as a hole in the middle of the thumb
    # cluster. This is a point rather than an `adjust` shift so that the
    # global mirror places it correctly on the right half too.
    # -------------------------------------------------------------------
    web:
      anchor:
        ref: matrix_inner_bottom
        shift: [21.5, -38]
      columns:
        web:
      rows:
        web:

    # -------------------------------------------------------------------
    # M2 mounting holes.
    #
    # These positions are NOT hand-picked. The layout is dense - switch
    # bodies in adjacent columns nearly touch and every key has a diode
    # 5.5 mm below it - so `src/find_mounts.py` searches the board for
    # points that are >= 4 mm clear of every pad on either face and >= 4 mm
    # inside the edge, then spreads the chosen ones out. Re-run it after
    # any layout change and paste the result back here.
    #
    # Declaring them as points (rather than as bare circles) means the PCB
    # holes and the case standoffs read the same numbers.
    # -------------------------------------------------------------------
    mounts:
      anchor:
        ref: matrix_pinky_home
      columns:
        m1:
          key: {spread: 0, shift: [117.7, 53.7]}
        m2:
          key: {spread: 0, shift: [3.7, 48.7]}
        m3:
          key: {spread: 0, shift: [65.7, 39.7]}
        m4:
          key: {spread: 0, shift: [117.7, -5.3]}
        m5:
          key: {spread: 0, shift: [43.7, -13.3]}
        m6:
          key: {spread: 0, shift: [92.7, -50.3]}
      rows:
        m:

  # Mirror to produce the right half. The axis sits at
  # (ref.x + distance/2), so this leaves a wide, unambiguous gap between
  # the two outlines.
  #
  # NOTE: the mirrored half exists for the preview and for the case
  # generator. The FABRICATED pcb is the left half only - see `board_left`
  # below and docs/ORDERING.md for why.
  mirror:
    ref: matrix_pinky_home
    distance: 280

outlines:
  # ---------------------------------------------------------------------
  # Naming convention in this section:
  #   *_all   - both halves, used only for the preview picture
  #   *_left  - the left half alone, which is what actually gets fabricated
  #
  # Only ONE pcb design is manufactured. The right half is the same board
  # flipped over, which works because every footprint is `reverse: true`
  # and therefore has pads on both faces. See docs/ORDERING.md.
  # ---------------------------------------------------------------------

  # Choc plate cutout is 13.8 mm square.
  _plate_holes:
    - what: rectangle
      where: /^(matrix|thumb)_/
      size: [13.8, 13.8]

  # Keycap envelopes, for visually checking nothing collides.
  _keycaps:
    - what: rectangle
      where: /^(mirror_)?(matrix|thumb)_/
      size: [17.5, 16.5]

  # --- Left half only: this is the fabricated outline -------------------
  _blob_left:
    - what: rectangle
      where: /^(matrix|thumb)_/
      size: [kx + bleed, ky + bleed]
    # Bridges. The thumb keys sit further from their neighbours than the
    # `bleed`-grown key pads can span, so the union would silently produce a
    # board in several disconnected pieces. Ergogen does not warn about
    # this; a board house would either reject the file or ship fragments.
    # check_outline.py enforces that these bridges do their job.
    - what: rectangle
      where: /^web_/
      size: [26, 16]
    # One pad covers the whole controller area in the notch between the
    # matrix and the thumb cluster. The jack and the reset button sit inside
    # it, so they need no pad of their own.
    - what: rectangle
      where: /^mcu_/
      size: [38, 64]

  # M2 clearance holes, subtracted from the board.
  _screws:
    - what: circle
      where: /^mounts_/
      radius: 1.1

  # Morphological closing: grow the blob by `close`, then shrink it back by
  # the same amount. That fills every concave pocket narrower than ~2*close
  # while leaving the board's overall L-shape untouched - a plain convex hull
  # would swallow the whole empty region left of the thumb cluster and add
  # ~40 cm2 of pointless board.
  #
  # The pockets between the thumb cluster, the controller area and the key
  # pads are dead space anyway, and their sharp concave corners are stress
  # risers in both 1.6 mm FR4 and the 1.3 mm printed plate. Filling all of
  # them costs about 1.3% more board area and nothing in bounding box.
  _blob_grown:
    - what: outline
      name: _blob_left
      expand: close
      joints: round

  _blob_closed:
    - what: outline
      name: _blob_grown
      expand: 0 - close
      joints: round

  board_left:
    - what: outline
      name: _blob_closed
      fillet: 2.5
    - operation: subtract
      what: outline
      name: _screws

  plate_left:
    - what: outline
      name: board_left
    - operation: subtract
      what: outline
      name: _plate_holes

  # --- Both halves: preview only ----------------------------------------
  _blob_all:
    - what: rectangle
      where: /^(mirror_)?(matrix|thumb)_/
      size: [kx + bleed, ky + bleed]
    - what: rectangle
      where: /^(mirror_)?web_/
      size: [26, 16]
    - what: rectangle
      where: /^(mirror_)?mcu_/
      size: [38, 64]

  _screws_all:
    - what: circle
      where: /^(mirror_)?mounts_/
      radius: 1.1

  # The preview closes each half SEPARATELY and only then unions them.
  # Closing the two together would bridge the ~31 mm gap between the halves -
  # a radius of 18 grows each side by 18 - and fuse them into one shape. That
  # never affected the fabricated board (board_left is the left half alone),
  # but it made the preview picture a lie.
  _blob_right:
    - what: rectangle
      where: /^mirror_(matrix|thumb)_/
      size: [kx + bleed, ky + bleed]
    - what: rectangle
      where: /^mirror_web_/
      size: [26, 16]
    - what: rectangle
      where: /^mirror_mcu_/
      size: [38, 64]

  _blob_right_grown:
    - what: outline
      name: _blob_right
      expand: close
      joints: round

  _blob_right_closed:
    - what: outline
      name: _blob_right_grown
      expand: 0 - close
      joints: round

  board_right:
    - what: outline
      name: _blob_right_closed
      fillet: 2.5

  board:
    - what: outline
      name: board_left
    - what: outline
      name: board_right
    - operation: subtract
      what: outline
      name: _screws_all

  preview:
    - what: outline
      name: board
    - what: outline
      name: _keycaps
      operation: stack

pcbs:
  pinkyless48:
    outlines:
      main:
        outline: board_left
    footprints:
      # -------------------------------------------------------------
      # Switches. hotswap + reverse puts Kailh CPG135001S30 socket pads on
      # BOTH sides of the board, which is what lets a single design serve
      # as the left half and, flipped over, the right half.
      # -------------------------------------------------------------
      switches:
        what: choc
        where: /^(matrix|thumb)_/
        params:
          keycaps: true
          reverse: true
          hotswap: true
          from: "{{colrow}}"
          to: "{{column_net}}"

      # -------------------------------------------------------------
      # Matrix diodes, COL2ROW. The "ComboDiode" footprint carries both
      # SMD (SOD-123) and through-hole pads; JLCPCB populates the SMD
      # pads, so you never touch these.
      # -------------------------------------------------------------
      diodes:
        what: diode
        where: /^(matrix|thumb)_/
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5.5]

      # -------------------------------------------------------------
      # Controller: RP2040 in Pro Micro form factor (Sea-Picro, Elite-Pi,
      # 0xCB Helios ...). Socketed on header strips - the only part you
      # solder. Net names are Pro Micro *silk labels*; see
      # docs/PIN_MAPPING.md for the RP2040 GPIO each becomes.
      # -------------------------------------------------------------
      mcu:
        what: promicro
        where: /^mcu_/
        params:
          orientation: up
          # Rows and columns are deliberately kept on Pro Micro pins whose
          # RP2040 mapping is unambiguous: silk 2-9 map to GP2-GP9 and
          # A0/A1 map to GP26/GP27 on every Pro Micro-footprint RP2040 board
          # (Sea-Picro, Elite-Pi, Helios). Avoiding pins 10/14/15/16 sidesteps
          # the one region where those boards disagree with each other.
          P2: R1
          P3: R2
          P4: R3
          P5: R4
          P6: R5
          P7: C1
          P8: C2
          P9: C3
          P18: C4
          P19: C5
          P1: DATA
          RAW: VCC
          VCC: VCC
          GND: GND
          RST: RST

      # -------------------------------------------------------------
      # TRRS jack (PJ-320A) linking the two halves.
      # reverse + symmetric keeps the pinout correct after the board flip,
      # which requires pins 1 and 2 to share a net - both are GND here.
      # -------------------------------------------------------------
      trrs:
        what: trrs
        where: /^trrs_/
        params:
          reverse: true
          symmetric: true
          A: GND
          B: GND
          C: VCC
          D: DATA

      # Reset button, SMD, populated by JLCPCB.
      reset:
        what: button
        where: /^reset_/
        params:
          from: RST
          to: GND
